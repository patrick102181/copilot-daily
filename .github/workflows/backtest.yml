name: 回測

# 每月 1 號自動重跑一次，改了 config.json 的規則之後也可以到 Actions 頁面手動執行。
on:
  schedule:
    - cron: "20 1 1 * *"
  workflow_dispatch:
    inputs:
      bars:
        description: "每個幣回測幾根 4H（1500 ≈ 250 天）"
        default: "1500"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 回測
        env:
          BARS: ${{ github.event.inputs.bars || '1500' }}
        run: python research/backtest.py --bars "$BARS"

      - name: 更新總結
        run: python scripts/ai_summary.py

      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "回測更新 $(date -u +'%Y-%m-%d')"
          git pull --rebase --quiet || true
          git push
